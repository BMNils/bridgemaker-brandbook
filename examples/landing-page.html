<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bridgemaker — We build ventures that matter.</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  section { padding: 120px 48px; }
  .wrap { max-width: 1200px; margin: 0 auto; }
  .display { font: var(--text-display); letter-spacing: var(--track-display); margin: 0; }
  .h1 { font: var(--text-h1); letter-spacing: var(--track-h1); margin: 0; }
  .h2 { font: var(--text-h2); letter-spacing: var(--track-h2); margin: 0; }
  .h3 { font: var(--text-h3); letter-spacing: var(--track-h3); margin: 0; }
  .h4 { font: var(--text-h4); letter-spacing: var(--track-h4); margin: 0; }
  .body { font: var(--text-body); color: var(--mid); }
  .eyebrow { font: var(--text-eyebrow); text-transform: uppercase; letter-spacing: 0.08em; color: var(--light); }
  .accent-bar { display: inline-block; width: 48px; height: 3px; background: var(--bm-purple); border-radius: 2px; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../starter-kit/components/Button.jsx"></script>
<script type="text/babel" src="../starter-kit/components/Card.jsx"></script>
<script type="text/babel" src="../starter-kit/components/Kasane.jsx"></script>
<script type="text/babel" src="../starter-kit/components/Nav.jsx"></script>

<div id="root"></div>

<script type="text/babel">
function LP() {
  return (
    <>
      <BmKasaneStyles />

      <BmNav
        brand={<img src="../assets/logos/wordmark-black.svg" alt="Bridgemaker" style={{ height: 18, display: "block" }} />}
        items={[
          { id: "ventures", label: "Ventures" },
          { id: "approach", label: "Ansatz" },
          { id: "team", label: "Team" },
          { id: "journal", label: "Journal" },
        ]}
        cta={<BmButton size="sm">Let's build</BmButton>}
      />

      {/* Hero — Kasane Dark */}
      <BmKasane variant="dark" style={{ height: "88vh", minHeight: 640 }}>
        <div className="wrap" style={{ height: "100%", display: "flex", flexDirection: "column", justifyContent: "center", padding: "0 48px" }}>
          <div className="eyebrow" style={{ color: "rgba(175,148,210,0.9)", marginBottom: 24 }}>Venture Builder, Berlin</div>
          <h1 className="display" style={{ color: "#fff", maxWidth: 900 }}>
            We build ventures<br/>that matter.
          </h1>
          <p className="body" style={{ color: "#A8A69E", maxWidth: 520, marginTop: 24, fontSize: 18 }}>
            Von der ersten These bis zum skalierbaren Geschäft — wir bauen gemeinsam mit Corporates und Foundern.
          </p>
          <div style={{ display: "flex", gap: 12, marginTop: 40 }}>
            <BmButton variant="primary" size="lg" onDark>Let's build together</BmButton>
            <BmButton variant="secondary" size="lg" onDark>Mehr erfahren</BmButton>
          </div>
        </div>
      </BmKasane>

      {/* Proof band */}
      <section style={{ background: "var(--surface-stone)", padding: "48px" }}>
        <div className="wrap" style={{ display: "grid", gridTemplateColumns: "auto repeat(4, 1fr)", gap: 40, alignItems: "center" }}>
          <div className="eyebrow">Seit 2018</div>
          {["40+ Ventures","€180M+ Funding","12 Märkte","3 Exits"].map(s => (
            <div key={s} style={{ font: "600 20px/1.2 Inter, sans-serif", letterSpacing: "-0.3px", color: "var(--charcoal)" }}>{s}</div>
          ))}
        </div>
      </section>

      {/* Feature trio */}
      <section id="approach">
        <div className="wrap">
          <div className="eyebrow">Unser Ansatz</div>
          <h2 className="h1" style={{ marginTop: 12, maxWidth: 720 }}>Drei Phasen.<br/>Ein Handwerk.</h2>
          <span className="accent-bar" style={{ marginTop: 24 }}></span>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16, marginTop: 64 }}>
            <BmCard surface="mauve">
              <div className="eyebrow" style={{ color: "var(--bm-purple)" }}>01, Validate</div>
              <h3 className="h3" style={{ marginTop: 16 }}>Thesen, die halten.</h3>
              <p className="body" style={{ marginTop: 12 }}>
                Wir testen Nachfrage, nicht Pitch-Decks. Landingpages, Prototypen, echte Kundengespräche — bevor ein Euro Entwicklung fließt.
              </p>
            </BmCard>
            <BmCard surface="sand">
              <div className="eyebrow" style={{ color: "var(--bm-deep-berry)" }}>02, Build</div>
              <h3 className="h3" style={{ marginTop: 16 }}>Produkte, die liefern.</h3>
              <p className="body" style={{ marginTop: 12 }}>
                MVP in 8 Wochen, nicht 8 Monaten. Kleine Teams, klare Deadlines, echte Nutzer in der ersten Woche.
              </p>
            </BmCard>
            <BmCard surface="sage">
              <div className="eyebrow" style={{ color: "var(--bm-deep-teal)" }}>03, Scale</div>
              <h3 className="h3" style={{ marginTop: 16 }}>Geschäfte, die wachsen.</h3>
              <p className="body" style={{ marginTop: 12 }}>
                Von Traction zu Skalierung. Fundraising, Hiring, operative Exzellenz — wir bleiben, bis es steht.
              </p>
            </BmCard>
          </div>
        </div>
      </section>

      {/* Deep dive */}
      <section style={{ background: "var(--surface-stone)" }}>
        <div className="wrap" style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: 80, alignItems: "center" }}>
          <div>
            <div className="eyebrow">Warum Bridgemaker</div>
            <h2 className="h2" style={{ marginTop: 12, maxWidth: 560 }}>
              Wir bauen nicht für, wir bauen mit.
            </h2>
            <p className="body" style={{ marginTop: 24, fontSize: 17, maxWidth: 560 }}>
              Keine Studios, keine Inkubatoren, keine Berater mit Whiteboards. Wir sind Unternehmer, die Unternehmen bauen — mit echten Teams, echter Exekution und echtem Skin-in-the-Game.
            </p>
            <p className="body" style={{ marginTop: 16, fontSize: 17, maxWidth: 560 }}>
              Jedes Venture bekommt dedicated Team, Kapital und unser volles operatives Commitment.
            </p>
          </div>
          <BmPlaceholder caption="Team in workshop, natural light, documentary" ratio="3 / 4" />
        </div>
      </section>

      {/* Ventures showcase */}
      <section id="ventures">
        <div className="wrap">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "end", marginBottom: 48 }}>
            <div>
              <div className="eyebrow">Ventures</div>
              <h2 className="h1" style={{ marginTop: 12 }}>Was wir gebaut haben.</h2>
            </div>
            <BmLink>Alle Ventures →</BmLink>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16 }}>
            {[
              { tag: "FinTech", title: "Rivet", desc: "Infrastructure for cross-border treasury.", tint: "purple" },
              { tag: "Climate", title: "Halden", desc: "Carbon-negative materials at industrial scale.", tint: "teal" },
              { tag: "Health", title: "Forn", desc: "Clinical diagnostics for underserved markets.", tint: "berry" },
            ].map(v => (
              <BmCard key={v.title} surface="white" style={{ padding: 0, overflow: "hidden" }}>
                <BmPlaceholder caption={`Venture hero, ${v.title}`} ratio="4 / 3" style={{ borderRadius: 0 }} />
                <div style={{ padding: 24 }}>
                  <BmBadge tint={v.tint}>{v.tag}</BmBadge>
                  <h3 className="h3" style={{ marginTop: 16 }}>{v.title}</h3>
                  <p className="body" style={{ marginTop: 8, fontSize: 15 }}>{v.desc}</p>
                </div>
              </BmCard>
            ))}
          </div>
        </div>
      </section>

      {/* CTA block — Kasane accent */}
      <section style={{ padding: "0 48px 120px" }}>
        <div className="wrap">
          <BmKasane variant="vibrant" style={{ borderRadius: 28, padding: 0 }}>
            <div style={{ padding: "80px 64px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 40, flexWrap: "wrap" }}>
              <div>
                <h2 className="h1" style={{ color: "#fff", maxWidth: 560 }}>
                  Innovation braucht Umsetzung.
                </h2>
                <p className="body" style={{ color: "rgba(255,255,255,0.75)", marginTop: 16, fontSize: 17 }}>
                  Lass uns über deine These sprechen.
                </p>
              </div>
              <BmButton variant="primary" size="lg" onDark>Let's build together</BmButton>
            </div>
          </BmKasane>
        </div>
      </section>

      {/* Footer */}
      <footer style={{ padding: "64px 48px", borderTop: "1px solid var(--surface-stone)" }}>
        <div className="wrap" style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1fr 1fr", gap: 40 }}>
          <div>
            <img src="../assets/logos/wordmark-black.svg" alt="Bridgemaker" style={{ height: 20, display: "block" }} />
            <p className="body" style={{ marginTop: 16, fontSize: 14, maxWidth: 320 }}>
              Bridgemaker GmbH, Berlin, 2026
            </p>
          </div>
          {[
            { h: "Ventures", items: ["Rivet", "Halden", "Forn", "Alle ansehen"] },
            { h: "Firma", items: ["Ansatz", "Team", "Karriere", "Kontakt"] },
            { h: "Journal", items: ["Essays", "Case Studies", "Press"] },
          ].map(col => (
            <div key={col.h}>
              <div className="eyebrow" style={{ marginBottom: 16 }}>{col.h}</div>
              <ul style={{ listStyle: "none", padding: 0, margin: 0, display: "grid", gap: 8 }}>
                {col.items.map(i => <li key={i} style={{ font: "var(--text-small)", color: "var(--mid)", cursor: "pointer" }}>{i}</li>)}
              </ul>
            </div>
          ))}
        </div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LP />);
</script>
</body>
</html>
