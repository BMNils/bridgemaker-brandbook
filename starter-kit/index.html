<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bridgemaker — Starter Kit</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body { background: var(--off-white); }
  .demo { padding: 80px 48px; max-width: 1200px; margin: 0 auto; }
  .demo h1 { font: var(--text-h1); letter-spacing: var(--track-h1); margin: 0 0 8px; }
  .demo p.lead { font: var(--text-body); color: var(--mid); margin: 0 0 64px; max-width: 560px; }
  .section { margin-bottom: 96px; }
  .section h2 { font: var(--text-h3); letter-spacing: var(--track-h3); margin: 0 0 24px; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .eyebrow { font: var(--text-eyebrow); text-transform: uppercase; letter-spacing: 0.08em; color: var(--light); margin-bottom: 16px; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/Button.jsx"></script>
<script type="text/babel" src="components/Card.jsx"></script>
<script type="text/babel" src="components/Form.jsx"></script>
<script type="text/babel" src="components/Kasane.jsx"></script>
<script type="text/babel" src="components/Nav.jsx"></script>

<div id="root"></div>

<script type="text/babel">
const { useState } = React;

function App() {
  const [email, setEmail] = useState("");
  return (
    <>
      <BmKasaneStyles />
      <BmNav
        brand="B—M"
        items={[
          { id: "buttons", label: "Buttons" },
          { id: "cards", label: "Cards" },
          { id: "forms", label: "Forms" },
          { id: "kasane", label: "Kasane" },
        ]}
        cta={<BmButton size="sm">Let's build</BmButton>}
      />

      <main className="demo">
        <div className="eyebrow">Bridgemaker Starter Kit</div>
        <h1>Composable React components.</h1>
        <p className="lead">Drop-in primitives, all wired to <code>tokens.css</code>. Use them as-is, or as reference for your own builds.</p>

        <section className="section" id="buttons">
          <h2>Buttons</h2>
          <div className="row" style={{ marginBottom: 16 }}>
            <BmButton variant="primary">Let's build together</BmButton>
            <BmButton variant="secondary">Mehr erfahren</BmButton>
            <BmButton variant="ghost">Abbrechen</BmButton>
            <BmLink>Alle Ventures →</BmLink>
          </div>
          <div className="row">
            <BmButton size="sm">Small</BmButton>
            <BmButton size="md">Medium</BmButton>
            <BmButton size="lg">Large</BmButton>
          </div>
          <div style={{ marginTop: 32, background: "#1C1C1E", borderRadius: 20, padding: 40 }}>
            <div className="row">
              <BmButton variant="primary" onDark>Auf dunklem Grund</BmButton>
              <BmButton variant="secondary" onDark>Sekundär</BmButton>
              <BmLink onDark>Link →</BmLink>
            </div>
          </div>
        </section>

        <section className="section" id="cards">
          <h2>Cards & Badges</h2>
          <div className="grid-3">
            <BmCard surface="white">
              <BmBadge tint="purple">Venture</BmBadge>
              <div style={{ font: "var(--text-h4)", marginTop: 16 }}>Standard Card</div>
              <p style={{ font: "var(--text-small)", color: "#6B6B65", marginTop: 8 }}>
                White surface, hairline border. Default for most contexts.
              </p>
            </BmCard>
            <BmCard surface="mauve">
              <BmBadge tint="berry">Hot</BmBadge>
              <div style={{ font: "var(--text-h4)", marginTop: 16 }}>Mauve Surface</div>
              <p style={{ font: "var(--text-small)", color: "#6B6B65", marginTop: 8 }}>
                Purple-DNA thematic grouping.
              </p>
            </BmCard>
            <BmCard surface="dark">
              <BmBadge tint="teal" style={{ background: "#1D6B66", color: "#E0F2F0" }}>Live</BmBadge>
              <div style={{ font: "var(--text-h4)", marginTop: 16, color: "#F5F1EB" }}>Dark Card</div>
              <p style={{ font: "var(--text-small)", color: "#A8A69E", marginTop: 8 }}>
                Contrast break within a light page.
              </p>
            </BmCard>
          </div>
        </section>

        <section className="section" id="forms">
          <h2>Forms</h2>
          <div style={{ maxWidth: 440, display: "grid", gap: 16 }}>
            <BmField label="E-Mail" help="Wir melden uns innerhalb von 24 Stunden.">
              <BmInput value={email} onChange={e => setEmail(e.target.value)} placeholder="team@bridgemaker.com" />
            </BmField>
            <BmField label="Was möchtest du bauen?">
              <BmTextarea placeholder="Eine kurze Beschreibung …" />
            </BmField>
            <BmButton variant="primary">Absenden</BmButton>
          </div>
        </section>

        <section className="section" id="kasane">
          <h2>Kasane Backgrounds</h2>
          <div style={{ display: "grid", gap: 16 }}>
            {["dark", "vibrant", "light"].map(v => (
              <BmKasane key={v} variant={v} height={240} style={{ borderRadius: 20 }}>
                <div style={{
                  padding: 32, height: "100%",
                  display: "flex", flexDirection: "column", justifyContent: "flex-end",
                }}>
                  <div style={{
                    font: "500 11px/1.4 Inter, sans-serif",
                    textTransform: "uppercase", letterSpacing: "0.1em",
                    color: v === "light" ? "rgba(28,28,30,0.4)" : "rgba(255,255,255,0.5)",
                    marginBottom: 8,
                  }}>Kasane — {v}</div>
                  <div style={{
                    font: "600 28px/1.15 Inter, sans-serif", letterSpacing: "-0.8px",
                    color: v === "light" ? "#1C1C1E" : "#fff",
                  }}>We build ventures that matter.</div>
                </div>
              </BmKasane>
            ))}
          </div>
        </section>
      </main>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
