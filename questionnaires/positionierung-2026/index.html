<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Positionierung 2026 — Bridgemaker Leadership</title>
  <meta name="description" content="Entscheidungsdokument für das Bridgemaker Leadership-Team. Positionierung bridgemaker.com 2026." />
  <link rel="stylesheet" href="../../tokens/tokens.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="q-header">
    <div class="q-header-inner">
      <a href="." class="q-brand" aria-label="Bridgemaker">
        <img src="../../assets/logos/wordmark-black.svg" alt="Bridgemaker" class="wordmark-dark" />
        <img src="../../assets/logos/wordmark-white.svg" alt="" aria-hidden="true" class="wordmark-light" />
      </a>
      <div class="q-progress" role="progressbar" aria-label="Fortschritt">
        <div class="q-progress-segments" id="progress-segments" aria-hidden="true"></div>
        <span class="q-progress-label" id="progress-label">Bereit?</span>
      </div>
    </div>
  </header>

  <main id="app" class="q-main" aria-live="polite"></main>

  <footer class="q-footer" id="footer" hidden>
    <div class="q-footer-inner">
      <button type="button" class="bm-btn bm-btn-ghost" id="btn-back">
        <span aria-hidden="true">←</span> Zurück
      </button>
      <div class="q-footer-meta" id="footer-meta"></div>
      <button type="button" class="bm-btn bm-btn-primary" id="btn-next">
        Weiter <span aria-hidden="true">→</span>
      </button>
    </div>
  </footer>

  <div class="q-toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./app.js" defer></script>
</body>
</html>
